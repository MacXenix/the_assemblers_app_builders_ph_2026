<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark aesthetic squircle frame -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <!-- Vibrant mint-green trance breaker circle -->
  <circle cx="54" cy="54" r="30" fill="#6EE7B7" filter="url(#glow)" />
  <!-- Dual pause / circuit-breaker bars -->
  <rect x="46" y="40" width="6" height="28" rx="2" fill="#0B1020" />
  <rect x="58" y="40" width="6" height="28" rx="2" fill="#0B1020" />
</svg>
